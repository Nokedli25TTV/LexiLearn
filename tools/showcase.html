<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LexiLearn – README képek</title>
<!--
  A README "Így néz ki" képei: négy telefon egy képen, mindegyikben az élő demó egy-egy jelenete
  (tools/demo.html?shot=…). Két sor van: tools/showcase.html?row=1 és ?row=2.
  A képeket a tools/readme-shots.mjs készíti el belőle (docs/readme/igy-nez-ki-1.webp és -2.webp).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --forest-deep: oklch(0.34 0.062 166);
    --forest: oklch(0.48 0.092 162);
    --forest-far: oklch(0.42 0.085 174);
    --ink: oklch(0.98 0.008 160);
    --ink-soft: oklch(0.90 0.04 160);
    --bezel: oklch(0.16 0.012 165);
    --phone-w: 232px;
    --scale: calc(232 / 375);
  }
  * { box-sizing: border-box; }
  html { background: transparent; }
  body { margin: 0; width: 1120px; font-family: 'Nunito', system-ui, sans-serif; background: transparent; }

  .sheet {
    position: relative; overflow: hidden; width: 1120px; padding: 46px 0 40px; border-radius: 28px;
    background:
      radial-gradient(560px 400px at 97% -8%, oklch(0.72 0.16 45 / 0.42), transparent 70%),
      radial-gradient(680px 480px at -4% 110%, oklch(0.74 0.12 160 / 0.34), transparent 70%),
      linear-gradient(128deg, var(--forest-deep) 0%, var(--forest) 56%, var(--forest-far) 100%);
  }
  .sheet[data-row="2"] {
    background:
      radial-gradient(560px 400px at 3% -8%, oklch(0.72 0.16 45 / 0.42), transparent 70%),
      radial-gradient(680px 480px at 104% 110%, oklch(0.74 0.12 160 / 0.34), transparent 70%),
      linear-gradient(232deg, var(--forest-deep) 0%, var(--forest) 56%, var(--forest-far) 100%);
  }

  /* Nagy, halvány írásjegyek a háttérben */
  .glyph {
    position: absolute; z-index: 0; color: var(--ink); opacity: 0.075; line-height: 1; font-weight: 700; user-select: none;
    font-family: 'Yu Mincho', 'YuMincho', 'Hiragino Mincho ProN', 'Noto Serif JP', 'MS Mincho', serif;
  }

  .row { position: relative; z-index: 1; display: flex; justify-content: center; gap: 30px; }
  .shot { width: calc(var(--phone-w) + 14px); margin: 0; }

  .phone {
    padding: 7px; border-radius: 34px; background: var(--bezel);
    box-shadow: 0 0 0 1px oklch(1 0 0 / 0.16), 0 30px 46px -18px oklch(0.12 0.03 165 / 0.75), 0 8px 16px -8px oklch(0.12 0.03 165 / 0.5);
  }
  .screen { position: relative; width: var(--phone-w); height: calc(812px * var(--scale)); border-radius: 27px; overflow: hidden; background: #0e1311; }
  .screen iframe { position: absolute; inset: 0 auto auto 0; width: 375px; height: 812px; border: 0; transform: scale(var(--scale)); transform-origin: 0 0; }

  figcaption { margin-top: 20px; text-align: center; }
  figcaption b { display: block; color: var(--ink); font-size: 21px; font-weight: 800; letter-spacing: -0.005em; line-height: 1.2; }
  figcaption span { display: block; margin: 5px auto 0; max-width: 23ch; color: var(--ink-soft); font-size: 14.5px; font-weight: 600; line-height: 1.38; }
</style>
</head>
<body>
<div class="sheet" id="sheet">
  <div class="row" id="row"></div>
</div>
<script>
const ROWS = {
  1: {
    glyphs: [['語', 'left:-34px; top:-58px; font-size:330px; transform:rotate(-8deg)'], ['あ', 'right:286px; bottom:-96px; font-size:300px; transform:rotate(7deg)'], ['学', 'right:-30px; top:150px; font-size:280px; transform:rotate(9deg)']],
    shots: [
      ['kezdolap', 'Kezdőlap', 'konzisztencia, napi penzum, egyetlen fő lépés'],
      ['tanulas', 'Új szavak', 'húzd jobbra, ha megy, balra, ha még nem'],
      ['ismetles', 'Ismétlés', 'négy gomb, Anki-szerű ütemezéssel'],
      ['gyakorlas', 'Gyakorlás', 'több lecke, csak a még nem tanult szavak', 'light']
    ]
  },
  2: {
    glyphs: [['字', 'right:-28px; top:-64px; font-size:330px; transform:rotate(8deg)'], ['週', 'left:292px; bottom:-104px; font-size:300px; transform:rotate(-7deg)'], ['書', 'left:-36px; top:140px; font-size:280px; transform:rotate(-9deg)']],
    shots: [
      ['vonassorrend', 'Vonássorrend', 'a kandzsi vonásonként megrajzolódik'],
      ['iras', 'Írásgyakorlás', 'rajzold meg ujjal, vonásról vonásra'],
      ['het', 'Heti összefoglaló', 'a hét számai az előző héthez mérve'],
      ['statisztika', 'Statisztika', 'konzisztencia, hőtérkép, tudás-érettség', 'light']
    ]
  }
};

const params = new URLSearchParams(location.search);
const rowKey = ROWS[params.get('row')] ? params.get('row') : '1';
const row = ROWS[rowKey];
const sheet = document.getElementById('sheet');
sheet.dataset.row = rowKey;
// A "serve" kiterjesztés nélküli címeket használ (tools/showcase); más szervernél marad a .html
const demo = location.pathname.endsWith('.html') ? 'demo.html' : 'demo';

row.glyphs.forEach(([ch, css]) => {
  const g = document.createElement('span');
  g.className = 'glyph';
  g.setAttribute('aria-hidden', 'true');
  g.style.cssText = css;
  g.textContent = ch;
  sheet.prepend(g);
});

document.getElementById('row').innerHTML = row.shots.map(([shot, title, sub, theme]) => `
  <figure class="shot">
    <div class="phone"><div class="screen"><iframe title="${title}" src="${demo}?quiet&shot=${shot}${theme ? '&theme=' + theme : ''}" scrolling="no"></iframe></div></div>
    <figcaption><b>${title}</b><span>${sub}</span></figcaption>
  </figure>`).join('');

// Kész, ha mind a négy jelenet beállt (ezt várja meg a tools/readme-shots.mjs)
(async () => {
  const frames = [...document.querySelectorAll('iframe')];
  for (let t = 0; t < 60000; t += 100) {
    const wins = frames.map(f => f.contentWindow);
    const failed = wins.map(w => w.__shotError).filter(Boolean);
    if (failed.length) { window.__showcaseError = failed.join(' | '); return; }
    if (wins.every(w => w.__shotReady)) break;
    await new Promise(r => setTimeout(r, 100));
  }
  await document.fonts.ready;
  window.__showcaseSize = [sheet.offsetWidth, sheet.offsetHeight];
  window.__showcaseReady = true;
})();
</script>
</body>
</html>
